[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "self-nomad"
version = "0.2.0.dev0"
description = "Git-backed portability and change governance for persistent AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "self-nomad contributors" }]
keywords = [
  "agent",
  "portability",
  "git",
  "cli",
  "hermes",
  "openclaw",
  "self-repository",
  "change-governance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]
dependencies = [
  "filelock>=3.17",
  "platformdirs>=4.3",
  "pydantic>=2.10",
  "PyYAML>=6.0.2",
  "rich>=13.9",
  "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/v-t-r-gg/self-nomad"
Repository = "https://github.com/v-t-r-gg/self-nomad"
Issues = "https://github.com/v-t-r-gg/self-nomad/issues"
Changelog = "https://github.com/v-t-r-gg/self-nomad/blob/main/CHANGELOG.md"

[project.scripts]
self-nomad = "self_nomad.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-PyYAML>=6.0.12",
]

[dependency-groups]
dev = [
  "build>=1.2",
  "jsonschema>=4.26.0",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/self_nomad"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/examples",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["self_nomad"]

# Coverage floor rationale (measured 2026-08-03 after in-process Typer CLI
# tests covering init/validate/propose/approve/apply/reject/adapters/status
# and a subprocess installed-command path): combined statement+branch report
# is about 83% on Linux once the trivial __main__ entry is omitted. Floor is
# 80% to absorb OS matrix variance without hiding a CLI or proposal regression
# that drops a whole module out of the report.
[tool.coverage.run]
source = ["self_nomad"]
branch = true
parallel = true
relative_files = true
omit = ["*/self_nomad/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.coverage.paths]
source = [
  "src/self_nomad",
  "*/site-packages/self_nomad",
]
