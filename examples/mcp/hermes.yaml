# Example Hermes MCP server entry for self-nomad.
# Merge under ~/.hermes/config.yaml (do not replace unrelated keys).
# Replace both absolute paths before use. self-nomad never writes this file.
#
# Official keys: command, args, env, tools.include|exclude, tools.prompts,
# tools.resources (see Hermes MCP documentation).
mcp_servers:
  self_nomad:
    command: "/absolute/path/to/self-nomad-mcp"
    args:
      - "--repo"
      - "/absolute/path/to/agent-self"
    tools:
      include:
        - self_nomad_repository_status
        - self_nomad_repository_validate
        - self_nomad_intake_preview
        - self_nomad_intake_submit
        - self_nomad_proposal_list
        - self_nomad_proposal_get
        - self_nomad_proposal_validate
      prompts: false
      resources: true
